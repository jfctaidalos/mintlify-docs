                - Sanctions
                - Human Rights Abuse
    main.overrideMediaArticleDispositionResponse:
      type: object
      properties:
        data:
          description: "`data` represents the structure containing the unique identifier
            for the updated media search article disposition."
          type: object
          properties:
            media_search_article_disposition_id:
              description: "`media_search_article_disposition_id` represents the unique
                identifier for the updated media search article disposition."
              type: string
              example: 123e4567-e89b-12d3-a456-426614174000
    main.overrideMediaSearchSummaryRequest:
      type: object
      properties:
        data:
          description: "`data` contains the media search summary details and risk
            assessment information for the override request."
          type: object
          properties:
            media_search_id:
              description: "`media_search_id` uniquely identifies a media search process
                within the override request payload."
              type: string
              example: 123e4567-e89b-12d3-a456-426614174000
            risk_categories:
              description: "`risk_categories` represents a list of risk categories associated
                with the media search."
              type: array
              items:
                type: string
              example:
                - Money Laundering
                - Sanctions
                - Human Rights Abuse
            risky:
              description: "`risky` indicates whether the media search is assessed as risky or
                not."
              type: boolean
              example: true
            summary:
              description: "`summary` provides a summary of the all media search's articles."
              type: string
              example: " - Jan Marsalek is a central figure in the Wirecard scandal, one of
                Germany's largest financial frauds, involving €1.9 billion in
                non-existent assets. /n - He is accused of fraud, false
                accounting, embezzlement, and operating a shadow empire
                alongside Wirecard's official operations. /n - Marsalek
                allegedly used third-party companies to siphon funds from banks
                and investors, and engaged in money laundering activities,
                particularly in the Philippines and Singapore."
    main.overrideMediaSearchSummaryResponse:
      type: object
      properties:
        data:
          description: "`data` contains details specific to the override media search
            summary response."
          allOf:
            - $ref: "#/components/schemas/main.overrideMediaSearchSummaryResponseItem"
    main.overrideMediaSearchSummaryResponseItem:
      type: object
      properties:
        media_search_summary_id:
          description: "`media_search_summary_id` uniquely identifies a media search
            summary entry in the response structure."
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
    main.problemJson:
      description: Standardized error response format
      type: object
      properties:
        context:
          description: "`context` provides additional information about the error,
            including the HTTP method and path where it occurred."
          allOf:
            - $ref: "#/components/schemas/main.defaultProblemContext"
        details:
          description: "`details` provides a detailed human-readable explanation of the
            specific error."
          type: string
          example: Details explaining the error
        instance:
          description: "`instance` specifies a unique URI identifying the context of the
            error, such as organisation, user, and request details."
          type: string
          example: /org/{org_id}/user/{user_id}/request-id/{request_id}
        title:
          description: "`title` provides a short, human-readable summary of the problem
            type or error encountered."
          type: string
          example: Error Title
        type:
          description: "`type` is a URI reference that identifies the problem type,
            allowing clients to recognize the type of error encountered."
          type: string
          example: https://errors.taidalos.com/common/{error-type}
