    main.subjectEntity:
      type: object
      properties:
        aliases:
          description: "`aliases` represent alternative names associated with the subject."
          type: array
          items:
            type: string
          example:
            - Facebook
            - Instagram
        created_at:
          description: "`created_at` represents the time when the subject entity was
            created."
          type: string
          example: 2024-10-22T07:37:56.676763Z
        created_by:
          description: "`created_by` represents information about the user that created
            the subject."
          allOf:
            - $ref: "#/components/schemas/main.createdBy"
        date_of_birth:
          description: "`date_of_birth` represents the date of birth of a subject."
          type: string
          example: 1980-04-07
        date_of_incorporation:
          description: "`date_of_incorporation` represents the date when the entity was
            legally formed, formatted as a string."
          type: string
          example: 1980-04-07
        industries:
          description: "`industries` represents a list of industries associated with the
            subject."
          type: array
          items:
            type: string
          example:
            - Banking
            - Insurance
            - Telecommunications
        internal_id:
          description: "`internal_id` represents the internal identifier for a subject,
            typically used for referencing within internal systems."
          type: string
          example: crm_id#123456789
        name:
          description: "`name` represents the name of the subject."
          type: string
          example: Jan Marsalek
        nationalities:
          description: "`nationalities` represents the list of nationalities associated
            with the subject."
          type: array
          items:
            type: string
          example:
            - US
            - UK
        places:
          description: "`places` contains a list of places associated with the subject."
          type: array
          items:
            $ref: "#/components/schemas/main.subjectPlace"
        subject_id:
          description: "`subject_id` represents the unique identifier for the subject."
          type: string
          example: d43a4ec2-3eb8-46ad-9ca9-09a26540968f
        type:
          description: "`type` represents the category of the subject, which could be an
            individual (INDIVIDUAL) or an organisation (LEGAL_ENTITY)."
          type: string
          enum:
            - INDIVIDUAL
            - LEGAL_ENTITY
            - VESSEL
    main.subjectMatch:
      type: object
