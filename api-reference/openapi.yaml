                - Telecommunications
            subject_industries_article:
              type: array
              items:
                type: string
              example:
                - Banking
                - Finance
                - Telecommunications
        match_score:
          type: number
          example: 7
        match_type:
          type: string
          example: MODERATE_MATCH
        match_type_description:
          type: string
          example: Similar
        nationality_matches:
          type: object
          properties:
            match_score:
              type: number
              example: 7
            match_type:
              type: string
              example: MODERATE_MATCH
            match_type_description:
              type: string
              example: Similar
            matches:
              type: array
              items:
                type: object
                properties:
                  match_score:
                    type: number
                    example: 0
                  match_type:
                    type: string
                    example: TOTAL_MISMATCH
                  match_type_description:
                    type: string
                    example: Not similar at all
