tags:
  - description: Operations about subjects
    name: Subjects
  - description: Operations about media search configuration
    name: Media Search Configuration
  - description: Operations about media search
    name: Media Search
externalDocs:
  description: Get started with guides
  url: https://taidalos.com/tags/guide/
servers:
  - url: https://api.taidalos.com
components:
  schemas:
    MediaSearchMetaAggregateResponse:
      type: object
      properties:
        data:
          description: "`data` represents the metadata item for a media search, containing
            details such as IDs, timestamps, and configurations."
          allOf:
            - $ref: "#/components/schemas/MediaSearchMetaAggregateResponseItem"
    MediaSearchMetaAggregateResponseItem:
      type: object
      properties:
        created_at:
          description: "`created_at` specifies the timestamp when the entity was created,
            formatted as an ISO 8601 string."
          type: string
          example: 2020-01-01T00:00:00Z
        created_by:
          description: "`created_by` indicates the identifier of the user who created the
            resource, typically a UUID."
          type: string
          example: c357e592-4a89-4381-b3b3-5015a36206b2
        media_search_configuration_id:
          description: "`media_search_configuration_id` is the unique identifier for a
            media search configuration."
          type: string
          example: 08f835bd-a347-4804-8c19-77f879f2972d
        media_search_execution_ids:
          description: "`media_search_execution_ids` contains a list of IDs representing
            the executions of a media search."
          type: array
          items:
            type: string
          example:
            - e592d75a-9ef7-4ed4-ab3e-0897858c5709
            - 3981d36e-3a94-475d-adc8-6a962184e772
            - a997bcf8-a7ea-437d-970b-32ac3d26f47d
        media_search_id:
          description: "`media_search_id` represents the unique identifier for a media
            search operation."
          type: string
          example: 64530ff9-2a7b-427e-8f4f-a670c8c18ee6
        organisation_id:
          description: "`organisation_id` represents the unique identifier of the
            organisation associated with the media search."
          type: string
          example: 123e4567-e89b-12d3-a456-426655440000
        subject_id:
          description: "`subject_id` represents the unique identifier of the subject
            associated with the media search operation."
          type: string
          example: a89c1104-9e8b-4de3-aefe-f2f4269cb2db
    main.KeyWordListResponseItem:
      type: object
      properties:
        keyword_list_id:
          type: string
        keywords:
          type: array
          items:
            type: string
        name:
          type: string
    main.NewKeyWordListInputItem:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
          example:
            - Fraud
            - Theft
            - Steal
            - Scam
            - Money Laundering
            - Sanction
            - Human Rights Violation
            - Terrorist
            - Organised Crime
            - Corrupt
            - Bribe
            - Tax Evasion
            - Convicted
            - Sentenced
            - Arrested
            - Child Labour
        name:
          type: string
          example: ESG Risk
    main.SanctionPepWatchlistSearch:
      type: object
      properties:
        created_at:
          type: string
        created_by:
          $ref: "#/components/schemas/main.createdBy"
        organisation_id:
          type: string
        sanction_pep_watchlist_id:
          type: string
        sanction_pep_watchlist_search_executions:
          type: array
          items:
            $ref: "#/components/schemas/main.sanctionPepWatchlistSearchExecution"
    main.createMediaSearchConfigRequest:
      type: object
      properties:
        data:
          description: "`data` contains the parameters for configuring a media search,
            such as keywords, risk categories, and language."
          type: object
          required:
            - keyword_lists
            - language
            - risk_categories
          properties:
            disambiguation_auto_risk_assessment:
              description: "`disambiguation_auto_risk_assessment` if `active` is set `true`,
                articles with the set disambiguation `threshold` or below will
                be automatically risk-assessed as not risky."
              type: object
              properties:
                active:
                  description: "`active` indicates whether the
                    `disambiguation_auto_risk_assessment`is active or not"
                  type: boolean
                  example: true
                threshold:
                  description: "`threshold` if an article has disambiguation match the score of
                    threshold or below, the article will be risk-assesses as not
                    risky."
                  type: integer
                  example: 2
            keyword_lists:
              description: "`keyword_lists` contains a list of keyword list input items, each
                representing a group of keywords for the search configuration."
              type: array
              items:
                $ref: "#/components/schemas/main.NewKeyWordListInputItem"
            keywords:
              description: "`WARNING: keywords are deprecated - use keyword_lists instead`.
                Your current implementation with `keywords` is still supported."
              type: array
              items:
                type: string
              example:
                - Fraud
                - Theft
                - Steal
                - Scam
                - Money Laundering
                - Sanction
                - Human Rights Violation
                - Terrorist
                - Organised Crime
                - Corrupt
                - Bribe
                - Tax Evasion
                - Convicted
                - Sentenced
                - Arrested
                - Child Labour
            language:
              description: "`language` represents the language the search will be summarised
                in. The language and the language of the risk_categories need to
                match."
              type: string
              example: en
            look_back_period:
              description: "`look_back_period` defines the look back period. Articles that got
                published before the look back period (today - days specified)
                will be ignored."
              allOf:
                - $ref: "#/components/schemas/main.lookBackPeriod"
            monitoring:
              description: "`monitoring` defines the monitoring configuration details
                associated with the media search configuration request."
              allOf:
                - $ref: "#/components/schemas/main.monitoringInput"
            risk_categories:
              description: "`risk_categories` represents a list of risk types."
              type: array
              items:
                type: string
              example:
                - Fraud
                - Money Laundering
                - Sanctions
                - Human Rights Abuse
                - Environmental Abuse
                - Terrorism
                - Organized Crime
                - Corruption
                - Tax Crimes
                - Violence
                - Theft
                - Discrimination
                - Other
    main.createMediaSearchRequest:
      type: object
      properties:
        data:
          description: "`data` holds the request payload for creating a media search,
            including subject, configuration, and execution details."
          type: object
          properties:
            execute_immediately:
              description: "`execute_immediately` indicates if the media search should be
                executed immediately after creation."
              type: boolean
              example: true
            media_search_configuration_id:
              description: "`media_search_configuration_id` represents the unique identifier
                for the media search configuration used in the// request
                Search.ConfigId represents the UUID for the media search
                configuration associated with the request."
              type: string
              example: 8920772b-c7a7-42cb-8a6b-0bdfbabb8334
            subject_id:
              description: "`subject_id` represents the unique identifier of the subject
                involved in the media search request."
              type: string
              example: 43a87a3d-0808-4fd2-9cd1-9dbc9c9f75e0
    main.createMediaSearchResponse:
      type: object
      properties:
        data:
          description: "`data` contains the media search result identifiers, including
            `media_search_id` and `media_search_execution_id`."
          type: object
          properties:
            media_search_execution_id:
              description: "`media_search_execution_id` represents the unique identifier for
                tracking the execution of a media search."
              type: string
            media_search_id:
              description: "`media_search_id` represents the unique identifier of a created
                media search within the response."
              type: string
    main.createSanctionsPepAndWatchlistSearchRequest:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/main.createSanctionsPepAndWatchlistSearchRequestIte\
            m"
    main.createSanctionsPepAndWatchlistSearchRequestItem:
      type: object
      properties:
        sanction_pep_watchlist_configuration_id:
          type: string
        subject_id:
          type: string
    main.createSanctionsPepAndWatchlistSearchResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/main.createSanctionsPepAndWatchlistSearchResponseIt\
            em"
    main.createSanctionsPepAndWatchlistSearchResponseItem:
      type: object
      properties:
        sanction_pep_watchlist_execution_id:
          type: string
        sanction_pep_watchlist_id:
          type: string
    main.createSanctionsPepsWatchlistsConfigurationRequest:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/main.createSanctionsPepsWatchlistsConfigurationRequ\
            estItem"
    main.createSanctionsPepsWatchlistsConfigurationRequestItem:
      type: object
    main.createSanctionsPepsWatchlistsConfigurationResponse:
      type: object
      properties:
        data:
