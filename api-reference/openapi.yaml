                    type: string
                    example: US
                  subject_nationality_article:
                    type: string
                    example: DE
            subject_nationalities:
              type: array
              items:
                type: string
              example:
                - US
                - UK
            subject_nationalities_article:
              type: array
              items:
                type: string
              example:
                - US
                - DE
        place_matches:
          type: object
          properties:
            match_score:
              type: integer
              example: 7
            match_type:
              type: string
              example: MODERATE_MATCH
            match_type_description:
              type: string
              example: Similar
            matches:
              type: array
              items:
                type: object
                properties:
                  distance:
                    type: object
                    properties:
